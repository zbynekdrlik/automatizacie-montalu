name: CI

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dev verzia musí byť > main
        run: |
          DEV=$(node -p "require('./package.json').version")
          git fetch origin main --depth 1
          MAIN=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo 0.0.0)
          echo "dev=$DEV main=$MAIN"
          HIGHEST=$(printf '%s\n%s\n' "$MAIN" "$DEV" | sort -V | tail -1)
          if [ "$DEV" = "$MAIN" ] || [ "$HIGHEST" != "$DEV" ]; then
            echo "::error::package.json verzia na dev ($DEV) musí byť vyššia než na main ($MAIN)"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (eslint + prettier --check)
        run: npm run lint
      - name: Typová kontrola (svelte-check)
        run: npm run check
      - name: Unit testy (vitest — 1:1 vektory výpočtov + dedup)
        run: npm test
      - name: Build
        run: npm run build
      - name: 3D vizuál chunk gzip <= 220 KB (#170 §2.13)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const zlib = require('zlib');
            const dir = 'build/client/_app/immutable/chunks';
            // FAIL LOUDLY, nie tichý exit(0) — review nález 🟡 #3: pri zmene
            // build layoutu (adapter update a pod.) sa má tento krok POKAZIŤ,
            // nie ticho 'nemám čo skontrolovať' prejsť ako zelený.
            if (!fs.existsSync(dir)) {
              console.error('::error::build/client/_app/immutable/chunks neexistuje — build layout sa zmenil, over cestu');
              process.exit(1);
            }
            // Viacero markerov, NIE len 'PMREMGenerator' — Vite rozdeľuje
            // three/OrbitControls/RoomEnvironment/BufferGeometryUtils (4
            // samostatné dynamické importy vo Vizual3D.svelte) do VIACERÝCH
            // samostatných chunkov; len 'PMREMGenerator' pokrylo v reálnom
            // builde iba 2 z 5 (review nález 🟡 #3, overené 'npm run build' +
            // ručnou inšpekciou skutočného výstupu — OrbitControls/
            // RoomEnvironment/BufferGeometryUtils chunky unikli, ~5% reálnej
            // veľkosti nepočítané).
            const MARKERY = ['PMREMGenerator', 'OrbitControls', 'RoomEnvironment', 'mergeGeometries', 'ACESFilmicToneMapping'];
            let total = 0;
            const hit = [];
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith('.js')) continue;
              const p = path.join(dir, f);
              const src = fs.readFileSync(p, 'utf8');
              if (!MARKERY.some((m) => src.includes(m))) continue;
              const gz = zlib.gzipSync(fs.readFileSync(p)).length;
              hit.push([f, gz]);
              total += gz;
            }
            const KB = 1024;
            console.log('three.js chunky:', hit.map(([f, g]) => f + ' ' + (g/KB).toFixed(1) + 'KB').join(', ') || '(žiadne)');
            console.log('spolu gzip:', (total/KB).toFixed(1) + 'KB (limit 220KB)');
            if (hit.length === 0) {
              console.error('::error::žiadny chunk nezodpovedal three.js markerom — guard pravdepodobne rozbitý (dynamic import zmenený?)');
              process.exit(1);
            }
            if (total > 220 * KB) { console.error('::error::viewer chunk presiahol 220KB gzip'); process.exit(1); }
          "
      - name: Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (reálny prehliadač, nula console errors)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH kľúč
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 167.233.125.9 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Rsync zdroj na VPS
        run: |
          ssh -i ~/.ssh/deploy_key root@167.233.125.9 'mkdir -p /opt/automatizacie-montalu/src'
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude .git --exclude node_modules --exclude data \
            ./ root@167.233.125.9:/opt/automatizacie-montalu/src/
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml root@167.233.125.9:/opt/automatizacie-montalu/docker-compose.yml
      - name: Build + up + verifikácia
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA7=${GITHUB_SHA::7}
          APP_VERSION="$VERSION ($SHA7)"
          ssh -i ~/.ssh/deploy_key root@167.233.125.9 "
            set -euo pipefail
            cd /opt/automatizacie-montalu
            APP_VERSION='$APP_VERSION' docker compose up -d --build
            for i in \$(seq 1 20); do
              sleep 3
              H=\$(curl -s http://127.0.0.1:8090/health || true)
              echo \"health: \$H\"
              echo \"\$H\" | grep -q '\"ok\":true' && echo \"\$H\" | grep -qF '$SHA7' && exit 0
            done
            echo 'Health/verzia nesedí po deployi'; docker logs --tail 50 automatizacie-montalu; exit 1
          "
