name: CI

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Na main NIKDY nerušiť bežiaci beh — push do main uprostred deploya by ho
  # zabil v polovici (SSH docker build + health poll). Na dev/PR ruší staršie.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version-check:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Trvá sekundy (2× node -p + git fetch --depth 1); zaseknutie zahoď rýchlo.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: dev verzia musí byť > main
        run: |
          DEV=$(node -p "require('./package.json').version")
          git fetch origin main --depth 1
          MAIN=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo 0.0.0)
          echo "dev=$DEV main=$MAIN"
          HIGHEST=$(printf '%s\n%s\n' "$MAIN" "$DEV" | sort -V | tail -1)
          if [ "$DEV" = "$MAIN" ] || [ "$HIGHEST" != "$DEV" ]; then
            echo "::error::package.json verzia na dev ($DEV) musí byť vyššia než na main ($MAIN)"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    # Fail-fast: job bez limitu môže pri zaseknutom kroku (napr. hung `playwright
    # install` na degradovanom GitHub runneri, 2026-08-18) visieť default 6 h. 25 min
    # pokrýva pomalý-ale-funkčný beh (lint+check+unit+build+e2e ~10 min) a zaseknutie
    # zahodí rýchlo namiesto blokovania merge na hodiny.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit prod závislostí (blokujúci — high+)
        # Blokuje merge pri high/critical advisory v PROD strome. `--omit=dev`
        # ignoruje dev-only nálezy (nejdú do image). Patched cez `overrides`
        # v package.json (brace-expansion, uuid). Beží pred lint/test/build,
        # aby zraniteľná dep padla rýchlo.
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (eslint + prettier --check)
        run: npm run lint
      - name: Typová kontrola (svelte-check)
        run: npm run check
      - name: Unit testy (vitest — 1:1 vektory výpočtov + dedup)
        run: npm test
      - name: Build
        run: npm run build
      - name: 3D vizuál chunk gzip <= 220 KB (#170 §2.13)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const zlib = require('zlib');
            const dir = 'build/client/_app/immutable/chunks';
            // FAIL LOUDLY, nie tichý exit(0) — review nález 🟡 #3: pri zmene
            // build layoutu (adapter update a pod.) sa má tento krok POKAZIŤ,
            // nie ticho 'nemám čo skontrolovať' prejsť ako zelený.
            if (!fs.existsSync(dir)) {
              console.error('::error::build/client/_app/immutable/chunks neexistuje — build layout sa zmenil, over cestu');
              process.exit(1);
            }
            // Viacero markerov, NIE len 'PMREMGenerator' — Vite rozdeľuje
            // three/OrbitControls/RoomEnvironment/BufferGeometryUtils (4
            // samostatné dynamické importy vo Vizual3D.svelte) do VIACERÝCH
            // samostatných chunkov; len 'PMREMGenerator' pokrylo v reálnom
            // builde iba 2 z 5 (review nález 🟡 #3, overené 'npm run build' +
            // ručnou inšpekciou skutočného výstupu — OrbitControls/
            // RoomEnvironment/BufferGeometryUtils chunky unikli, ~5% reálnej
            // veľkosti nepočítané).
            const MARKERY = ['PMREMGenerator', 'OrbitControls', 'RoomEnvironment', 'mergeGeometries', 'ACESFilmicToneMapping'];
            let total = 0;
            const hit = [];
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith('.js')) continue;
              const p = path.join(dir, f);
              const src = fs.readFileSync(p, 'utf8');
              if (!MARKERY.some((m) => src.includes(m))) continue;
              const gz = zlib.gzipSync(fs.readFileSync(p)).length;
              hit.push([f, gz]);
              total += gz;
            }
            const KB = 1024;
            console.log('three.js chunky:', hit.map(([f, g]) => f + ' ' + (g/KB).toFixed(1) + 'KB').join(', ') || '(žiadne)');
            console.log('spolu gzip:', (total/KB).toFixed(1) + 'KB (limit 220KB)');
            if (hit.length === 0) {
              console.error('::error::žiadny chunk nezodpovedal three.js markerom — guard pravdepodobne rozbitý (dynamic import zmenený?)');
              process.exit(1);
            }
            if (total > 220 * KB) { console.error('::error::viewer chunk presiahol 220KB gzip'); process.exit(1); }
          "
      # Cache prehliadačov Playwright — na cache-hit sa preskočí pomalé/nespoľahlivé
      # sťahovanie Chromia (redukuje riziko hung `playwright install`). Kľúč viazaný na
      # lockfile: zmena verzie @playwright/test → nový kľúč → čerstvé stiahnutie.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright
        # `--with-deps` spúšťa apt-get na systémové knižnice; na degradovanom apt mirrore
        # GitHub runnera (2026-08-18) sa apt zasekol na desiatky minút. Ohraničíme pokus
        # na 6 min a padneme na inštaláciu SAMOTNÉHO prehliadača (systémové knižnice sú na
        # ubuntu-latest predinštalované) — pri zaseknutom apt sa tak beh nezablokuje.
        run: timeout 360 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: E2E (reálny prehliadač, nula console errors)
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Deploy (build + rollback + health) + inštalácia Playwright + post-deploy E2E
    # cez SSH tunel. Bez limitu visí default 6 h; 20 min pokrýva build+poll (~5) +
    # npm ci + playwright install (~5) + E2E (cap 10) s rezervou.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: SSH kľúč
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 167.233.125.9 >> ~/.ssh/known_hosts 2>/dev/null
      - name: E2E secrets prítomné?
        # Secrets sa nedajú čítať v step-level `if:`; nastav step output a gatuj ním
        # ďalšie kroky. Chýbajúce E2E secrets → hlasný ::warning:: + skip (NIE potlačenie
        # chyby, NIE ticho zelený), aby deploy nezlyhal na chýbajúcom
        # secrete. Health poll (ok+SHA7) je backstop verzie.
        id: e2e_secrets
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: |
          if [ -n "$E2E_USER" ] && [ -n "$E2E_PASS" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Post-deploy E2E preskocena::E2E_USER/E2E_PASS secrets chybaju v prostredi production - funkcna post-deploy E2E (prihlasenie + verzia z DOM) sa NEspustila. Health poll uz overil ok+SHA7 (backstop). Pridaj secrets do GitHub environment production pre plnu verifikaciu.'
          fi
      - name: Rsync zdroj + compose + deploy skript na VPS
        run: |
          ssh -i ~/.ssh/deploy_key root@167.233.125.9 'mkdir -p /opt/automatizacie-montalu/src'
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude .git --exclude node_modules --exclude data \
            ./ root@167.233.125.9:/opt/automatizacie-montalu/src/
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml root@167.233.125.9:/opt/automatizacie-montalu/docker-compose.yml
          scp -i ~/.ssh/deploy_key deploy/deploy-remote.sh root@167.233.125.9:/opt/automatizacie-montalu/deploy-remote.sh
      - name: Deploy (build + rollback-safe up + health)
        # deploy-remote.sh: build+tag, odchyt prev image, up, health poll; pri
        # zlyhaní rollback na prev image + re-poll + exit 1 s logmi (#254).
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA7=${GITHUB_SHA::7}
          ssh -i ~/.ssh/deploy_key root@167.233.125.9 \
            "APP_VERSION='$VERSION ($SHA7)' SHA7='$SHA7' bash /opt/automatizacie-montalu/deploy-remote.sh"
      - name: npm ci (pre post-deploy E2E)
        if: success() && steps.e2e_secrets.outputs.present == 'true'
        run: npm ci
      - name: Cache Playwright browsers
        if: success() && steps.e2e_secrets.outputs.present == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright browser install
        if: success() && steps.e2e_secrets.outputs.present == 'true'
        run: timeout 360 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Post-deploy E2E (SSH tunel, verzia z DOM, read-only)
        # PO úspešnom health polle: read-only smoke proti nasadenej appke cez tunel
        # (login + [data-testid=version] == SHA7 + stránky bez console chýb). Zlyhanie
        # = červený job (ALARM), ale rollback sa TU NEROBÍ — nová verzia je zdravá.
        id: postdeploy_e2e
        if: success() && steps.e2e_secrets.outputs.present == 'true'
        timeout-minutes: 10
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: |
          SHA7=${GITHUB_SHA::7}
          # tunel: localhost:18091 → VPS 127.0.0.1:8090 (8091 býva obsadený presenterom)
          ssh -f -N -L 18091:127.0.0.1:8090 -i ~/.ssh/deploy_key -o ExitOnForwardFailure=yes root@167.233.125.9
          for _ in $(seq 1 15); do curl -sf --max-time 5 -o /dev/null http://localhost:18091/health && break || sleep 1; done
          DEPLOY_SHA7="$SHA7" BASE_URL=http://localhost:18091 npx playwright test post-deploy.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # always() lebo pri zlyhaní E2E je job vo `failure` stave a implicitné
        # `success() &&` by tento krok preskočilo → padnutý report by sa nenahral.
        if: always() && steps.postdeploy_e2e.outcome == 'failure'
        with:
          name: post-deploy-playwright-report
          path: playwright-report
          retention-days: 7
