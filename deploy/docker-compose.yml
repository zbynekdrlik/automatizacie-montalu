# Nasadenie na VPS (167.233.125.9) do /opt/automatizacie-montalu.
# Zdroj sa rsyncuje z CI do ./src; build beží na VPS (deploy z committed ref).
# Mounty zdieľané s n8n: dlv-import (Money) + montalu (TEST priečinok).
# Env (SEED_USERS, MONEY_LIVE) v /opt/automatizacie-montalu/.env — NIE v gite.
# App je v sieti n8n_default, aby ju n8n Caddy vedel proxovať (app.montalu.cloud).
#
# /opt/automatizacie-montalu/ceny (#154, fáza 1): denný READ-ONLY Money cenový
# snapshot (JSON), namontovaný `:ro` — appka ho LEN číta (`scripts/ceny-snapshot.py`
# + cron/rsync na dev1 ho tam napĺňa, appka doň nikdy nezapisuje). Priečinok na VPS
# vytvor `mkdir -p /opt/automatizacie-montalu/ceny` pred prvým `docker compose up`.
services:
  app:
    build:
      context: ./src
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: automatizacie-montalu
    restart: unless-stopped
    # Rotácia logov — default json-file bez limitu môže zaplniť disk VPS.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    # Runtime image node:24-*-slim NEMÁ curl → health cez node global fetch.
    # App počúva vnútri kontajnera na 3000 (verejne cez Caddy na 8090/443).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - '127.0.0.1:8090:3000' # len localhost — verejne ide cez Caddy (TLS)
    environment:
      DATABASE_PATH: /data/app/app.db
      MONEY_LIVE: ${MONEY_LIVE:-0}
      SEED_USERS: ${SEED_USERS:-}
      BODY_SIZE_LIMIT: 1M
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # #251 SEC-1: bez ADDRESS_HEADER vracia getClientAddress() IP kontajnera
      # Caddy (konštantná pre všetkých) → per-(username,ip) lockout by degeneroval
      # na globálny-per-meno a útočník by vedel natrvalo zamknúť reálneho usera.
      # Caddy (edge) pridáva reálnu klientsku IP ako POSLEDNÝ prvok X-Forwarded-For;
      # XFF_DEPTH=1 číta práve ten posledný → spoof-safe (klientom podstrčený XFF
      # prefix sa ignoruje). Priama požiadavka bez hlavičky (healthcheck /health)
      # getClientAddress() nevolá; login akcia ho volá v try/catch → bucket '-'.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      CENY_SNAPSHOT_PATH: /data/ceny/ceny.json
    volumes:
      - appdata:/data/app
      - /opt/n8n/mounts/dlv-import:/data/dlv-import
      - /opt/n8n/mounts/montalu:/data/montalu
      - /opt/automatizacie-montalu/ceny:/data/ceny:ro
    networks:
      - n8n_default

volumes:
  appdata:

networks:
  n8n_default:
    external: true
